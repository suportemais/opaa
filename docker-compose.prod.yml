services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command:
      [
        "sh",
        "-lc",
        "apps/api/node_modules/.bin/prisma migrate deploy --config apps/api/prisma.config.ts",
      ]
    networks:
      web:
        aliases:
          - opaa-migrate

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_BASE_URL: https://opiina.com
      APP_BASE_DOMAIN: opiina.com
      API_BASE_PATH: /api
      COOKIE_SECURE: "true"
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      web:
        aliases:
          - opaa-api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_BASE_DOMAIN: opiina.com
    depends_on:
      - api
    networks:
      web:
        aliases:
          - opaa-web

networks:
  web:
    external: true
