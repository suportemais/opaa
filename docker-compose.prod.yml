services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED}
      WEBHOOK_N8N_URL: ${WEBHOOK_N8N_URL}
      WEBHOOK_N8N_TOKEN: ${WEBHOOK_N8N_TOKEN}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS}
      WEBHOOK_BATCH_SIZE: ${WEBHOOK_BATCH_SIZE}
    command:
      [
        "sh",
        "-lc",
        "apps/api/node_modules/.bin/prisma migrate deploy --config apps/api/prisma.config.ts",
      ]
    restart: "no"
    networks:
      web:
        aliases:
          - opaa-migrate

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_BASE_URL: https://opiina.com
      APP_BASE_DOMAIN: opiina.com
      API_BASE_PATH: /api
      COOKIE_SECURE: "true"
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED}
      WEBHOOK_N8N_URL: ${WEBHOOK_N8N_URL}
      WEBHOOK_N8N_TOKEN: ${WEBHOOK_N8N_TOKEN}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS}
      WEBHOOK_BATCH_SIZE: ${WEBHOOK_BATCH_SIZE}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      web:
        aliases:
          - opaa-api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_BASE_DOMAIN: opiina.com
    restart: unless-stopped
    depends_on:
      - api
    networks:
      web:
        aliases:
          - opaa-web

networks:
  web:
    external: true
